name: apprain_barcode_scanner_android
description: Android implementation of the apprain_barcode_scanner plugin.
version: 1.0.0
repository: https://github.com/yagmure15/apprain_barcode_scanner

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  apprain_barcode_scanner_platform_interface:
    path: ../apprain_barcode_scanner_platform_interface
  flutter:
    sdk: flutter

flutter:
  plugin:
    implements: apprain_barcode_scanner
    platforms:
      android:
        package: com.apprain.barcode_scanner
        pluginClass: ApprainBarcodeScannerPlugin
        dartPluginClass: ApprainBarcodeScannerAndroid

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0
